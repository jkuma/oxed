[package]
name = "gpui_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
bench-support = ["gpui/bench-support", "gpui_wgpu/bench-support"]
inspector = ["gpui/inspector"]
test-support = ["gpui/test-support", "gpui_wgpu/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_linux/screen-capture"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[[bench]]
name = "focus_cleanup"
path = "../gpui/benches/focus_cleanup.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_linux.workspace = true
gpui_wgpu = { workspace = true, optional = true }

[dev-dependencies]
bench_metrics.workspace = true
criterion.workspace = true
